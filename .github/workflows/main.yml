name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate secrets
        run: |
          test -n "${{ secrets.GOLDEN_FUTURE_SERVER_SECRET }}" || (echo "Missing private key secret" && exit 1)
          test -n "${{ secrets.CPANEL_HOST }}" || (echo "Missing CPANEL_HOST" && exit 1)
          test -n "${{ secrets.CPANEL_USER }}" || (echo "Missing CPANEL_USER" && exit 1)
          test -n "${{ secrets.CPANEL_REPO_PATH }}" || (echo "Missing CPANEL_REPO_PATH" && exit 1)

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/id_rsa <<'EOF'
          ${{ secrets.GOLDEN_FUTURE_SERVER_SECRET }}
          EOF
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -p 22 "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH login
        run: |
          ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa -p 22 "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" "pwd"

      - name: Push to cPanel repository
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git remote remove production || true
          git remote add production "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:${{ secrets.CPANEL_REPO_PATH }}"
          git push production HEAD:main --force