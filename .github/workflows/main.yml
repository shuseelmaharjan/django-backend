name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          test -n "${{ secrets.GOLDEN_FUTURE_INSTITUTE_PRIVATE_SECRET }}" || (echo "Missing private key secret" && exit 1)
          test -n "${{ secrets.CPANEL_HOST }}" || (echo "Missing CPANEL_HOST" && exit 1)
          test -n "${{ secrets.CPANEL_USER }}" || (echo "Missing CPANEL_USER" && exit 1)

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GOLDEN_FUTURE_INSTITUTE_PRIVATE_SECRET }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -p 22 "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH login
        run: |
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa -p 22 "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" "pwd"
